name: Deploy superAdmin to VPS

# Jab bhi developer main branch par push ya PR merge kare, ye chalega
on:
  push:
    branches: [main]
  workflow_dispatch: # GitHub Actions tab se manually bhi chala sakte ho

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  FRONTEND_PATH: /var/www/superadmin/superAdmin/dist # nginx ka root
  BACKEND_PATH: /var/www/superadmin/backend          # pm2 ka exec cwd
  PM2_NAME: superadmin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---------- FRONTEND BUILD (React + Vite) ----------
      - name: Frontend install + build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: https://investors.teiltd.in/api
          VITE_AUTH_API_URL: https://investors.teiltd.in/api/auth

      # ---------- SSH SETUP ----------
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # ---------- FRONTEND DEPLOY ----------
      - name: Upload frontend (dist)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }}" \
            frontend/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.FRONTEND_PATH }}/

      # ---------- BACKEND DEPLOY ----------
      - name: Upload backend
        run: |
          # --delete nahi lagaya, taaki server ki .env / uploads / logs safe rahein
          rsync -avz \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.git' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }}" \
            backend/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.BACKEND_PATH }}/

      - name: Backend install + PM2 restart
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            ". ~/.nvm/nvm.sh && nvm use 22 > /dev/null && cd ${{ env.BACKEND_PATH }} && npm ci --omit=dev && pm2 restart ${{ env.PM2_NAME }} && pm2 save"
